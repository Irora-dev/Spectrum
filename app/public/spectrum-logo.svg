<!-- THE SPECTRUM MARK, as a standalone hosted logo.

     Served at <site>/spectrum-logo.svg by EVERY kit deployment, so any operator
     site (a community one included) has a stable, self-hosted logo URL for token
     lists and aggregator submissions. Referenced as the `logoURI` that
     scripts/build-tokenlist.mjs stamps into /tokenlist.json.

     GEOMETRY IS BYTE-FAITHFUL TO public/favicon.svg — deliberately not redrawn.
     That file is the mark already in front of users in their browser tab, so the
     logo an aggregator shows must be the same object, not a second interpretation
     of it. Only the wrapper changed: an intrinsic 256px size for consumers that
     need one, a namespaced clip id so the file is safe to inline beside other
     SVGs, and title/desc for assistive tech. KEEP THE TWO IN SYNC: change one and
     you must change the other, or the tab and the token list stop agreeing.

     Self-contained by requirement: no external refs, no fonts, no CSS variables
     (aggregator UIs fetch this cross-origin and often render it in an <img>,
     where none of those resolve). The dark plate is intentional rather than a
     transparent cutout, so the mark reads as deliberate on light AND dark UI. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="256" height="256" role="img" aria-labelledby="spectrum-logo-title spectrum-logo-desc">
  <title id="spectrum-logo-title">Spectrum</title>
  <desc id="spectrum-logo-desc">A prism splitting white light into a spectrum of coloured rays.</desc>
  <defs>
    <clipPath id="spectrum-logo-prism"><path d="M24 8 L41 38 L7 38 Z"/></clipPath>
  </defs>
  <rect width="48" height="48" rx="10" fill="#07070b"/>
  <path d="M24 8 L41 38 L7 38 Z" fill="#0b0b12"/>
  <g clip-path="url(#spectrum-logo-prism)" stroke-linecap="round" stroke-width="2.1">
    <line x1="24" y1="24" x2="11" y2="38" stroke="rgb(255,114,125)"/>
    <line x1="24" y1="24" x2="18" y2="38" stroke="rgb(216,81,205)"/>
    <line x1="24" y1="24" x2="24" y2="38" stroke="rgb(123,92,255)"/>
    <line x1="24" y1="24" x2="30" y2="38" stroke="rgb(74,185,255)"/>
    <line x1="24" y1="24" x2="37" y2="38" stroke="rgb(52,219,224)"/>
    <line x1="24" y1="24" x2="33" y2="25" stroke="rgb(53,223,251)"/>
    <line x1="24" y1="24" x2="38" y2="33" stroke="rgb(53,218,217)"/>
    <line x1="24" y1="24" x2="15" y2="25" stroke="rgb(255,81,177)"/>
    <line x1="24" y1="24" x2="10" y2="33" stroke="rgb(255,122,112)"/>
  </g>
  <path d="M24 8 L41 38 L7 38 Z" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
</svg>
