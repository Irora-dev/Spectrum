<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1376 768">
  <!-- The homepage's light-plane backdrop (owner 2026-08-20): soft pastel
       rainbow orbs hugging the edges + dashed rings, center left clear for
       content. Vector recreation of the supplied art so it stays crisp at any
       size and weighs ~2KB; the page shows it at the plane's cap (60%). -->
  <defs>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9ec7"/><stop offset="0.55" stop-color="#ffc98f"/><stop offset="1" stop-color="#a9d9ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0.9">
      <stop offset="0" stop-color="#ff9ec7"/><stop offset="0.5" stop-color="#9fd8ff"/><stop offset="1" stop-color="#8ff0c8"/>
    </linearGradient>
    <linearGradient id="g3" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffc98f"/><stop offset="0.5" stop-color="#ff9ec7"/><stop offset="1" stop-color="#c9a8ff"/>
    </linearGradient>
    <linearGradient id="g4" x1="0" y1="0.2" x2="1" y2="0.8">
      <stop offset="0" stop-color="#a8f0d0"/><stop offset="0.5" stop-color="#d8b8ff"/><stop offset="1" stop-color="#ffb8d8"/>
    </linearGradient>
    <linearGradient id="g5" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffa8c8"/><stop offset="0.5" stop-color="#c8b0ff"/><stop offset="1" stop-color="#a8e8ff"/>
    </linearGradient>
    <linearGradient id="g6" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ffe0a0"/><stop offset="0.35" stop-color="#a8f0c0"/><stop offset="0.7" stop-color="#a0d0ff"/><stop offset="1" stop-color="#c0a8ff"/>
    </linearGradient>
    <linearGradient id="g7" x1="0" y1="0.3" x2="1" y2="0.7">
      <stop offset="0" stop-color="#c0a8ff"/><stop offset="0.5" stop-color="#ff9ec7"/><stop offset="1" stop-color="#a0e8c0"/>
    </linearGradient>
    <linearGradient id="g8" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#ffc090"/><stop offset="0.5" stop-color="#ff9ec0"/><stop offset="1" stop-color="#c0a8f0"/>
    </linearGradient>
  </defs>

  <!-- orbs -->
  <g filter="url(#soft)">
    <circle cx="150" cy="155" r="95" fill="url(#g1)"/>
    <circle cx="520" cy="30" r="115" fill="url(#g2)"/>
    <circle cx="765" cy="200" r="95" fill="url(#g3)"/>
    <circle cx="1085" cy="75" r="125" fill="url(#g4)"/>
    <circle cx="1370" cy="430" r="150" fill="url(#g5)"/>
    <circle cx="10" cy="505" r="160" fill="url(#g6)"/>
    <circle cx="355" cy="755" r="105" fill="url(#g7)"/>
    <circle cx="1115" cy="735" r="115" fill="url(#g8)"/>
  </g>

  <!-- dashed rings, crisp -->
  <!-- full internal opacity: the page's 60% cap is the ONLY fade, so rings
       read like the reference art at 60% instead of 0.7×0.6 = 42% -->
  <g fill="none" stroke-width="3" stroke-dasharray="6 10">
    <circle cx="85" cy="55" r="95" stroke="#c9b8e8"/>
    <circle cx="430" cy="65" r="90" stroke="#d8a8d8"/>
    <circle cx="840" cy="140" r="92" stroke="#a8d8d0"/>
    <circle cx="1205" cy="125" r="85" stroke="#c0b0e0"/>
    <circle cx="1310" cy="540" r="115" stroke="#c9a8d8"/>
    <circle cx="490" cy="700" r="85" stroke="#a8d8d0"/>
    <circle cx="150" cy="760" r="80" stroke="#a8d8d0"/>
    <circle cx="250" cy="735" r="95" stroke="#c9b8e8"/>
    <circle cx="950" cy="705" r="88" stroke="#a8d8d0"/>
  </g>
</svg>
